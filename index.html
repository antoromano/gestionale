<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#09090b" />
  <meta name="description" content="Web app gestionale per professionisti, freelance e piccole attività" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
  <link rel="apple-touch-icon" href="/icons/icon-192.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <title>Gestionale</title>
  <link rel="stylesheet" href="/src/styles/main.css" />
  <link rel="stylesheet" href="/src/styles/ui.css" />
</head>
<body>
  <div class="app-container">
    <!-- MENU LATERALE (costruito da src/modules/shell.js) -->
    <aside class="sidebar" id="app-sidebar">
      <div class="sidebar-header">
        <div id="sidebar-logo-container">
          <div class="sidebar-logo-placeholder" id="sidebar-logo-placeholder">G</div>
        </div>
        <div class="sidebar-title" id="sidebar-app-name">Gestionale</div>
      </div>
      <nav class="nav-list" id="nav-main" aria-label="Menu principale"></nav>
      <div class="sidebar-footer" id="nav-footer"></div>
    </aside>

    <div class="main-wrapper">
      <header class="top-bar">
        <div class="top-left">
          <button id="mobile-menu-toggle" class="btn btn-sm btn-secondary menu-toggle" aria-label="Apri il menu">☰</button>
          <h1 class="page-title" id="page-title-text">Oggi</h1>
        </div>

        <!-- Inbox unico: qualunque cosa scrivi qui, la smisto io -->
        <form class="inbox" id="inbox-form" autocomplete="off">
          <input id="inbox-input" class="inbox-input" type="text" maxlength="2000"
            placeholder="Scrivi qui una cosa qualsiasi: una spesa, un impegno, un appunto…" aria-label="Scrivi qualcosa da registrare" />
          <button type="submit" class="btn btn-primary btn-sm" id="inbox-send">Invia</button>
          <button type="button" class="btn btn-secondary btn-sm" id="inbox-queue" title="Mettila da parte: la elaboro dopo, tutte insieme, con una sola richiesta all'IA">Da parte</button>
          <button type="button" class="queue-chip" id="inbox-queue-chip" hidden></button>
        </form>

        <div class="top-actions"></div>
      </header>

      <main class="content-body" id="app-main-content"></main>
    </div>

    <nav class="bottom-nav" id="nav-bottom" aria-label="Menu rapido"></nav>
  </div>

  <div id="backup-modal-container"></div>
  <div id="toast-container"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
